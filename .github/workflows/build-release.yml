name: Build and Release APK
permissions:
  contents: write

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

jobs:
  build-go:
    name: Build (go engine)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all history for tags
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.1'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260821190718-4776eadac327
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260821190718-4776eadac327
          # Do not use `gomobile init`: it unconditionally installs gobind@latest.
          # `gomobile bind` only needs this marker directory to exist plus gobind
          # on PATH (same as what init provides).
          mkdir -p "$(go env GOPATH)/pkg/gomobile"

      - name: Install NDK 28.2.13676358
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Get version from git tag
        id: get_version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=${TAG#v}
          APP_VERSION="${VERSION}"
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          echo "version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "Building go flavor version: ${APP_VERSION}"

      - name: Build yggstack AAR
        run: |
          cd lib/yggstack
          chmod +x mobile/build-android.sh
          echo "Building production AAR with stripped symbols..."
          ./mobile/build-android.sh
          echo "AAR built successfully:"
          ls -lh android-build/yggstack.aar
          mkdir -p ../../app/libs/
          cp android-build/yggstack.aar ../../app/libs/

      - name: Download latest publicnodes.json for bundled asset
        run: |
          curl -fsSL --max-time 15 https://publicpeers.neilalexander.dev/publicnodes.json \
            -o app/src/main/assets/publicnodes.json \
          || curl -fsSL --max-time 15 https://peers.yggdrasil.link/publicnodes.json \
            -o app/src/main/assets/publicnodes.json \
          || echo "All mirrors unavailable; keeping committed publicnodes.json"
          echo "Bundled publicnodes.json size: $(wc -c < app/src/main/assets/publicnodes.json) bytes"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > ${{ github.workspace }}/release.keystore

      - name: Build Release APK (go)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleGoRelease

      - name: Rename APKs
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          cd app/build/outputs/apk/go/release

          # Rename architecture-specific APKs (names unchanged from the
          # single-engine era: the go flavor keeps the legacy naming)
          mv app-go-arm64-v8a-release.apk yggstack-${VERSION}-arm64-v8a.apk
          mv app-go-armeabi-v7a-release.apk yggstack-${VERSION}-armeabi-v7a.apk
          mv app-go-x86-release.apk yggstack-${VERSION}-x86.apk
          mv app-go-x86_64-release.apk yggstack-${VERSION}-x86_64.apk
          mv app-go-universal-release.apk yggstack-${VERSION}-universal.apk

          ls -lh

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: go-apks
          path: app/build/outputs/apk/go/release/*.apk

  build-ng:
    name: Build (ng engine / Rust)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK 28.2.13676358
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "ndk;28.2.13676358"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> $GITHUB_ENV

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            lib/yggstack-ng/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('lib/yggstack-ng/**/Cargo.lock') }}

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Get version from git tag
        id: get_version
        run: |
          TAG="${{ github.ref_name }}"
          VERSION=${TAG#v}
          APP_VERSION="${VERSION}"
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          echo "version=${APP_VERSION}" >> $GITHUB_OUTPUT
          echo "Building ng flavor version: ${APP_VERSION}"

      - name: Build yggstack-ng native libraries
        run: |
          cd lib/yggstack-ng
          for t in aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android; do
            echo "=== $t ==="
            cargo ndk -t $t -o ../../app/src/ng/jniLibs build -p yggstack-mobile --release
          done
          echo "Native libraries built:"
          find ../../app/src/ng/jniLibs -name "*.so" -exec ls -lh {} \;

      - name: Download latest publicnodes.json for bundled asset
        run: |
          curl -fsSL --max-time 15 https://publicpeers.neilalexander.dev/publicnodes.json \
            -o app/src/main/assets/publicnodes.json \
          || curl -fsSL --max-time 15 https://peers.yggdrasil.link/publicnodes.json \
            -o app/src/main/assets/publicnodes.json \
          || echo "All mirrors unavailable; keeping committed publicnodes.json"
          echo "Bundled publicnodes.json size: $(wc -c < app/src/main/assets/publicnodes.json) bytes"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > ${{ github.workspace }}/release.keystore

      - name: Build Release APK (ng)
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleNgRelease

      - name: Rename APKs
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          cd app/build/outputs/apk/ng/release

          # ng flavor APKs carry a -ng name segment to distinguish the Rust engine
          mv app-ng-arm64-v8a-release.apk yggstack-ng-${VERSION}-arm64-v8a.apk
          mv app-ng-armeabi-v7a-release.apk yggstack-ng-${VERSION}-armeabi-v7a.apk
          mv app-ng-x86-release.apk yggstack-ng-${VERSION}-x86.apk
          mv app-ng-x86_64-release.apk yggstack-ng-${VERSION}-x86_64.apk
          mv app-ng-universal-release.apk yggstack-ng-${VERSION}-universal.apk

          ls -lh

      - name: Upload APKs
        uses: actions/upload-artifact@v7
        with:
          name: ng-apks
          path: app/build/outputs/apk/ng/release/*.apk

  release:
    name: Create release
    needs: [build-go, build-ng]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for the changelog

      - name: Download go APKs
        uses: actions/download-artifact@v4
        with:
          name: go-apks
          path: dist

      - name: Download ng APKs
        uses: actions/download-artifact@v4
        with:
          name: ng-apks
          path: dist

      - name: List release artifacts
        run: ls -lh dist/

      - name: Generate changelog
        id: changelog
        run: |
          # Get the previous tag
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p')

          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous release tag found, generating full changelog"
            CHANGELOG_HEADER="Initial release"
            git log --pretty=format:"- %s (%h)" ${{ github.ref_name }} > changelog_commits.txt
          else
            echo "Generating changelog from $PREVIOUS_TAG to ${{ github.ref_name }}"
            CHANGELOG_HEADER="Changes since ${PREVIOUS_TAG}:"
            git log --pretty=format:"- %s (%h)" $PREVIOUS_TAG..${{ github.ref_name }} > changelog_commits.txt
          fi

          # Create the full release body
          cat > release_body.md << 'RELEASE_BODY_END'
          ### Changelog
          RELEASE_BODY_END

          echo "${CHANGELOG_HEADER}" >> release_body.md
          echo "" >> release_body.md
          cat changelog_commits.txt >> release_body.md

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/yggstack-*.apk
          body_path: release_body.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
